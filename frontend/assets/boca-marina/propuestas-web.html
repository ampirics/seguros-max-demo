<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boca Marina · Propuestas de inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Caveat:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Italiana&family=Jost:wght@300;400;500&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B2A2E;--sand:#F4ECDF;--sea:#7FCFCB;--coral:#E8866A;--coral2:#C8593B;--bar:56px;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,sans-serif;--pad:clamp(20px,6vw,96px);--sec:clamp(80px,11vw,160px)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#E7E2D9;color:var(--ink);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
ol,ul{list-style:none}
svg.wa{width:16px;height:16px;fill:currentColor;flex:none}

/* barra de propuestas */
.top{position:sticky;top:0;z-index:100;height:var(--bar);display:flex;align-items:center;gap:24px;padding:0 20px;background:rgba(11,42,46,.97);color:var(--sand)}
.top b{font:500 19px/1 var(--serif);white-space:nowrap}
.top b span{font:300 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;opacity:.6;margin-left:10px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tabs a{font-size:12px;letter-spacing:.04em;padding:8px 12px;border-radius:99px;white-space:nowrap;opacity:.62;transition:opacity .3s,background .3s}
.tabs a i{font-style:normal;font-weight:500;margin-right:6px;color:var(--sea)}
.tabs a:hover{opacity:1}
.tabs a.on{background:var(--sand);color:var(--ink);opacity:1}
.tabs a.on i{color:var(--coral2)}
@media(max-width:900px){.top b{display:none}}

/* ficha antes de cada maqueta */
.intro{scroll-margin-top:var(--bar);max-width:1240px;margin:0 auto;padding:110px 24px 40px;display:grid;grid-template-columns:150px 1fr;gap:32px;color:#3B4A4B}
.intro-n{font:300 92px/.8 var(--serif);color:var(--ink)}
.intro h2{font:400 34px/1.1 var(--serif);color:var(--ink);margin-bottom:18px}
.intro dl{display:grid;grid-template-columns:120px 1fr;gap:8px 20px;font-size:14.5px;line-height:1.6;max-width:880px}
.intro dt{font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding-top:4px;color:#7A8A8A}
@media(max-width:700px){.intro{grid-template-columns:1fr;gap:8px;padding:80px 16px 28px}.intro-n{font-size:56px}.intro dl{grid-template-columns:1fr;gap:2px}.intro dd{margin-bottom:10px}}
.mock{position:relative;overflow:clip;box-shadow:0 30px 80px -40px rgba(11,42,46,.45)}

/* piezas comunes */
.h{position:sticky;top:var(--bar);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:20px;height:64px;padding:0 var(--pad);background:var(--hbg,rgba(244,236,223,.9));color:var(--hfg,var(--ink));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--hline,transparent)}
.h-brand{display:flex;align-items:center;gap:12px;min-width:0}
.h-brand img{width:34px;height:34px;border-radius:7px}
.h-brand span{font:500 21px/1 var(--hfont,var(--serif));white-space:nowrap}
.h-brand small{display:block;font:400 9px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;margin-top:5px;opacity:.65}
.h-nav{display:flex;gap:30px;font-size:13px;letter-spacing:.1em}
.h-nav a{opacity:.85;transition:opacity .3s}.h-nav a:hover{opacity:1}
.h-end{display:flex;align-items:center;gap:18px;font-size:12px}
.h-lang{letter-spacing:.1em;white-space:nowrap}.h-lang a{opacity:.5}
.h-tel{opacity:.6;white-space:nowrap}
.h-wa{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:var(--rad,99px);background:var(--wabg,var(--ink));color:var(--wafg,var(--sand));font-weight:500;letter-spacing:.06em;white-space:nowrap;transition:transform .4s,filter .4s}
.h-wa:hover{filter:brightness(1.08)}
@media(max-width:1000px){.h-nav,.h-tel{display:none}}
@media(max-width:560px){.h{height:58px;gap:10px}.h-brand small,.h-wa .lg{display:none}.h-brand span{font-size:18px}.h-brand img{width:30px;height:30px}.h-wa{padding:9px 13px}.h-end{gap:12px}}
.btn{display:inline-flex;align-items:center;gap:10px;padding:17px 28px;border-radius:var(--rad,99px);font:500 13px/1 var(--sans);letter-spacing:.08em;transition:filter .4s,transform .4s;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.b-ink{background:var(--ink);color:var(--sand)}.b-coral{background:var(--coral);color:var(--ink)}.b-sand{background:var(--sand);color:var(--ink)}.b-deep{background:var(--coral2);color:#fff}
.lnk{font-size:12px;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid currentColor;padding-bottom:3px;white-space:nowrap}
.eb{font-size:11px;letter-spacing:.34em;text-transform:uppercase}
@media(max-width:560px){.lnk{white-space:normal;letter-spacing:.1em;line-height:1.6}.btn{white-space:normal;line-height:1.25}}
.rec{display:flex;justify-content:center;gap:clamp(24px,6vw,96px);flex-wrap:wrap;padding:30px var(--pad);text-align:center}
.rec div{display:flex;flex-direction:column;gap:6px}
.rec b{font:500 19px/1.2 var(--serif)}
.rec span{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;opacity:.65}
.f{background:var(--fbg,var(--ink));color:var(--ffg,var(--sand));padding:var(--sec) var(--pad) 36px}
.f-cta{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;padding-bottom:56px;margin-bottom:56px;border-bottom:1px solid var(--fline,rgba(244,236,223,.16))}
.f-cta p{font:300 clamp(30px,4vw,54px)/1.08 var(--ffont,var(--serif));max-width:640px}
.f-grid{display:grid;grid-template-columns:1.3fr 1.2fr 1fr 1.2fr 1fr;gap:32px;font-size:14px;line-height:1.75}
.f-grid h4{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:500;opacity:.55;margin-bottom:12px}
.f-grid img{width:44px;height:44px;border-radius:8px;margin-bottom:14px}
.f-grid .bn{font:500 24px/1 var(--ffont,var(--serif))}
.f-grid .bs{display:block;font-size:10px;letter-spacing:.28em;text-transform:uppercase;opacity:.6;margin-top:8px}
.f-grid .q{opacity:.55;font-size:12.5px}
.f-lang{margin-top:10px;letter-spacing:.12em}.f-lang a{opacity:.5}
.f-legal{margin-top:64px;font-size:11.5px;opacity:.45;letter-spacing:.06em}
@media(max-width:900px){.f-grid{grid-template-columns:1fr 1fr}.f-grid>div:first-child{grid-column:1/-1}}
@media(max-width:480px){.f-grid{grid-template-columns:1fr}}
.fabw{position:sticky;bottom:16px;height:0;z-index:40;display:none;justify-content:flex-end;padding-right:16px}
.fab{transform:translateY(-100%);display:inline-flex;align-items:center;gap:9px;padding:15px 20px;border-radius:99px;background:var(--fab,#1F7A5A);color:#fff;font:500 13px/1 var(--sans);letter-spacing:.04em;box-shadow:0 14px 34px -10px rgba(0,0,0,.45)}
.fab svg{width:20px;height:20px;fill:currentColor}
@media(max-width:760px){.fabw{display:flex}}
.im{overflow:hidden}.im img{width:100%;height:100%;object-fit:cover}
.zoom img{transition:transform 1.8s cubic-bezier(.2,.7,.2,1)}.zoom:hover img{transform:scale(1.045)}
[data-r]{opacity:0;transform:translateY(22px);transition:opacity 1.3s ease,transform 1.5s cubic-bezier(.2,.7,.2,1)}
[data-r].in{opacity:1;transform:none}
.kb{animation:kb 26s ease-out both}
@keyframes kb{from{transform:scale(1.1)}to{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-r]{opacity:1;transform:none;transition:none}.kb,.p5-hero .b{animation:none!important}.zoom img,.p9-imgs img{transition:none!important}}

/* P1 cine */
.p1{--hbg:rgba(11,42,46,.62);--hfg:var(--sand);--wabg:var(--coral);--wafg:var(--ink);--fab:var(--coral2);background:var(--ink);color:var(--sand)}
.p1-hero{position:relative;height:calc(100svh - var(--bar));min-height:600px;max-height:980px;margin-top:-64px;overflow:hidden;display:flex;align-items:flex-end}
.p1-hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 68%}
.p1-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,42,46,.5),transparent 28%,transparent 42%,rgba(11,42,46,.9))}
.p1-t{position:relative;z-index:1;padding:0 var(--pad) clamp(48px,9vh,110px);max-width:1180px}
.p1-t .eb{margin-bottom:26px;opacity:.85}
.p1-t h1{font:300 clamp(56px,9.6vw,156px)/.88 var(--serif);letter-spacing:-.025em}
.p1-t h1 em{color:#F7C9AC}
.p1-t .l{max-width:460px;margin:30px 0 38px;font-size:16.5px;line-height:1.7;font-weight:300;opacity:.92}
.p1-cta{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.p1-cta small{font-size:13px;opacity:.75;max-width:250px;line-height:1.5}
.p1-coord{position:absolute;z-index:1;right:var(--pad);bottom:clamp(48px,9vh,110px);writing-mode:vertical-rl;font-size:10px;letter-spacing:.4em;text-transform:uppercase;opacity:.65}
.p1-lede{padding:var(--sec) 24px;text-align:center}
.p1-lede p{max-width:900px;margin:auto;font:300 clamp(27px,3.5vw,48px)/1.24 var(--serif)}
.p1-lede em{color:var(--sea)}
.p1 .rec{border-top:1px solid rgba(244,236,223,.14);border-bottom:1px solid rgba(244,236,223,.14);padding:26px var(--pad)}
.p1-ch{display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:0 var(--pad);margin-bottom:52px}
.p1-ch .eb{color:var(--coral)}
.p1-ch h2{font:300 clamp(42px,5.6vw,86px)/1 var(--serif)}
.p1-zones,.p1-dishes,.p1-events{padding:var(--sec) 0}
.p1-strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,27vw);gap:22px;overflow-x:auto;padding:0 var(--pad) 26px;scroll-snap-type:x mandatory;scroll-padding:0 var(--pad);scrollbar-width:thin;scrollbar-color:rgba(244,236,223,.25) transparent}
.p1-fr{scroll-snap-align:start}
.p1-fr .im{aspect-ratio:3/4;margin-bottom:20px}
.p1-fr .n{font-size:11px;letter-spacing:.3em;opacity:.5}
.p1-fr h3{font:400 30px/1.1 var(--serif);margin:6px 0 8px}
.p1-fr p{font-size:14px;line-height:1.65;opacity:.7;margin-bottom:16px;font-weight:300}
.p1 .lnk{color:var(--sea)}
.p1-dish{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:clamp(28px,6vw,100px);padding:0 var(--pad);margin-bottom:clamp(56px,8vw,110px)}
.p1-dish:nth-child(even) .im{order:2}
.p1-dish .im{aspect-ratio:4/5;max-height:640px}
.p1-dish .n{font:300 110px/.8 var(--serif);color:transparent;-webkit-text-stroke:1px rgba(244,236,223,.35)}
.p1-dish h3{font:300 clamp(36px,4.2vw,62px)/1.02 var(--serif);margin:18px 0 16px}
.p1-dish p{font-size:15.5px;line-height:1.75;opacity:.75;max-width:420px;font-weight:300}
.p1-award{margin:0 var(--pad);padding:clamp(40px,6vw,80px);border:1px solid rgba(232,134,106,.45);display:grid;grid-template-columns:auto 1fr;gap:clamp(24px,5vw,72px);align-items:center}
.p1-award .y{font:300 clamp(80px,12vw,180px)/.8 var(--serif);color:var(--coral)}
.p1-award h3{font:300 clamp(32px,3.6vw,52px)/1.05 var(--serif);margin:12px 0}
.p1-award p{opacity:.7;line-height:1.7;max-width:460px;font-weight:300}
.p1-sun{position:relative;min-height:92vh;display:flex;align-items:center;overflow:hidden}
.p1-sun>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.p1-sun:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,42,46,.85),rgba(11,42,46,.2) 65%)}
.p1-sun div{position:relative;z-index:1;padding:0 var(--pad);max-width:720px}
.p1-sun h2{font:300 clamp(44px,6vw,92px)/.98 var(--serif);margin:20px 0 26px}
.p1-sun p{font-size:16.5px;line-height:1.75;opacity:.85;margin-bottom:34px;font-weight:300;max-width:460px}
.p1-ev{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;padding:0 var(--pad)}
.p1-ev .im{aspect-ratio:4/5;margin-bottom:18px}
.p1-ev h3{font:400 26px/1.1 var(--serif);margin-bottom:8px}
.p1-ev p{font-size:14px;line-height:1.6;opacity:.7;margin-bottom:16px;font-weight:300}
.p1 .f{--fbg:#071E21}
@media(max-width:900px){.p1-dish{grid-template-columns:1fr}.p1-dish:nth-child(even) .im{order:0}.p1-ev{grid-template-columns:1fr 1fr}.p1-award{grid-template-columns:1fr}.p1-coord{display:none}}
@media(max-width:560px){.p1-hero{margin-top:-58px}.p1-ev{grid-template-columns:1fr}.p1-strip{grid-auto-columns:78vw}}

/* P2 elige tu lugar */
.p2{--hbg:rgba(244,236,223,.93);--wabg:var(--ink);--fab:var(--ink);background:var(--sand)}
.p2-hero{display:grid;grid-template-columns:1.05fr 1fr;min-height:calc(100svh - var(--bar) - 64px)}
.p2-pic{position:relative;overflow:hidden;min-height:520px}
.p2-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%}
.p2-pic:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(11,42,46,.82))}
.p2-pic div{position:absolute;z-index:1;left:clamp(20px,4vw,56px);right:clamp(20px,4vw,56px);bottom:clamp(28px,5vw,56px);color:var(--sand)}
.p2-pic h1{font:300 clamp(46px,5.6vw,88px)/.95 var(--serif);margin-top:14px}
.p2-pic p{margin-top:16px;font-size:15px;opacity:.85;font-weight:300}
.p2-ch{padding:clamp(36px,5vw,72px) clamp(20px,4.5vw,72px);display:flex;flex-direction:column;justify-content:center}
.p2-ch .eb{color:var(--coral2)}
.p2-ch h2{font:400 clamp(36px,3.6vw,54px)/1 var(--serif);margin:14px 0 28px}
.p2-list{border-top:1px solid rgba(11,42,46,.15)}
.p2-list button{width:100%;display:grid;grid-template-columns:36px 1fr auto;align-items:baseline;gap:12px;padding:15px 4px;border-bottom:1px solid rgba(11,42,46,.15);text-align:left;transition:background .4s,padding .4s}
.p2-list span{font-size:11px;opacity:.45;letter-spacing:.1em}
.p2-list b{font:500 22px/1.1 var(--serif)}
.p2-list em{font-style:normal;font-size:12.5px;opacity:.55}
.p2-list button.on{background:rgba(127,207,203,.28);padding-left:14px}
.p2-list button.on b{color:var(--coral2)}
.p2-prev{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center;margin:24px 0}
.p2-prev .im{aspect-ratio:1;border-radius:4px}
.p2-prev p{font-size:14.5px;line-height:1.6;opacity:.8}
.p2-note{font-size:12.5px;opacity:.6;margin-top:14px;line-height:1.5}
.p2-map{padding:var(--sec) var(--pad);display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(32px,6vw,96px);align-items:center;background:#EAF5F3}
.p2-map h2{font:300 clamp(40px,4.6vw,70px)/1 var(--serif);margin:14px 0 20px}
.p2-map p{font-size:15.5px;line-height:1.75;opacity:.8;max-width:440px}
.p2-aer{position:relative;max-width:520px;justify-self:center;width:100%}
.p2-aer img{width:100%;border-radius:6px}
.p2-pin{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--sand);color:var(--ink);font:500 12px/30px var(--sans);text-align:center;box-shadow:0 0 0 0 rgba(232,134,106,.6),0 6px 16px rgba(0,0,0,.25);transition:background .4s,color .4s,transform .4s}
.p2-pin.on{background:var(--coral2);color:#fff;transform:scale(1.2);animation:pulse 2.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 14px rgba(232,134,106,0),0 6px 16px rgba(0,0,0,.25)}}
.p2-sec{padding:var(--sec) var(--pad)}
.p2-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:44px}
.p2-head h2{font:300 clamp(40px,4.6vw,70px)/1 var(--serif)}
.p2-dishes{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.p2-dishes .im{aspect-ratio:3/4;border-radius:4px;margin-bottom:14px}
.p2-dishes h3{font:500 21px/1.15 var(--serif)}
.p2-dishes p{font-size:13px;opacity:.65;margin-top:6px;line-height:1.5}
.p2-aw{aspect-ratio:3/4;border-radius:4px;margin-bottom:14px;background:var(--ink);color:var(--sand);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
.p2-aw b{font:300 64px/1 var(--serif);color:var(--coral)}
.p2-aw span{font-size:10px;letter-spacing:.24em;text-transform:uppercase;opacity:.75;margin-top:10px;line-height:1.6}
.p2 .rec{background:var(--ink);color:var(--sand)}
.p2-sun{display:grid;grid-template-columns:1fr 1fr;background:var(--coral);color:var(--ink)}
.p2-sun .im{min-height:520px}
.p2-sun div{padding:clamp(40px,6vw,96px);align-self:center}
.p2-sun h2{font:300 clamp(40px,4.4vw,66px)/1 var(--serif);margin:14px 0 18px}
.p2-sun p{font-size:15.5px;line-height:1.7;margin-bottom:28px;max-width:420px}
.p2-ev{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.p2-ev a{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:center;padding:16px;background:#fff;border-radius:6px;transition:transform .5s}
.p2-ev a:hover{transform:translateY(-3px)}
.p2-ev .im{aspect-ratio:1;border-radius:4px}
.p2-ev h3{font:500 25px/1.1 var(--serif);margin-bottom:6px}
.p2-ev p{font-size:13.5px;opacity:.7;line-height:1.55;margin-bottom:12px}
.p2-ev .lnk{color:var(--coral2)}
@media(max-width:1000px){.p2-hero,.p2-map,.p2-sun{grid-template-columns:1fr}.p2-pic{min-height:62svh}.p2-dishes{grid-template-columns:repeat(2,1fr)}.p2-ev{grid-template-columns:1fr}.p2-sun .im{min-height:340px}}
@media(max-width:520px){.p2-ev a{grid-template-columns:96px 1fr;gap:14px;padding:12px}.p2-list em{display:none}}

/* P3 tipografico */
.p3{--hbg:rgba(251,248,243,.94);--hline:rgba(11,42,46,.08);--wabg:var(--ink);--fab:var(--ink);--fbg:#FBF8F3;--ffg:var(--ink);--fline:rgba(11,42,46,.12);background:#FBF8F3;font-weight:300}
.p3 .h-brand span{font:400 17px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase}
.p3-hero{padding:clamp(70px,10vw,150px) var(--pad) clamp(60px,8vw,110px)}
.p3-k{font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.55}
.p3-hero h1{font:300 clamp(58px,10.5vw,176px)/.9 var(--sans);letter-spacing:-.045em;margin:34px 0 64px}
.p3-hero h1 em{font:italic 300 1.06em/1 var(--serif);letter-spacing:-.02em}
.p3-hrow{display:grid;grid-template-columns:260px 1fr 1fr;gap:clamp(24px,5vw,80px);align-items:end;border-top:1px solid rgba(11,42,46,.15);padding-top:30px}
.p3-hrow .im{aspect-ratio:4/5}
.p3-hrow dl{display:grid;grid-template-columns:auto 1fr;gap:10px 22px;font-size:14px}
.p3-hrow dt{opacity:.5}
.p3-cta p{font-size:15px;line-height:1.6;margin-bottom:22px;max-width:320px}
.p3-cta .tel{display:block;margin-top:16px;font-size:13px;opacity:.55}
.p3-sec{display:grid;grid-template-columns:200px 1fr;gap:32px;padding:clamp(60px,8vw,110px) var(--pad);border-top:1px solid rgba(11,42,46,.12)}

.p11-ph figcaption{padding:10px 6px 6px;font-size:14px;line-height:1.4}
.p11-ph figcaption b{display:block;font:500 19px/1.15 var(--serif)}
.p11-ph .aw{aspect-ratio:1;border-radius:8px;background:var(--ink);color:var(--sand);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.p11-ph .aw b{font:300 56px/1 var(--serif);color:var(--coral)}
.p11-ph .aw span{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;margin-top:8px;line-height:1.6}
.p11 .rec{background:#fff}
.p11-sun{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,80px);align-items:center;background:var(--ink);color:var(--sand)}
.p11-sun .im{aspect-ratio:4/5;border-radius:12px;max-height:680px}
.p11-sun h2{margin-bottom:20px}
.p11-sun p{font-size:16px;line-height:1.75;opacity:.8;margin-bottom:30px;max-width:440px;font-weight:300}
.p11-sun .eb{color:var(--sea)}
.p11-ev{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.p11-ev a{display:block;background:#fff;border-radius:14px;padding:8px 8px 18px;transition:transform .5s}
.p11-ev a:hover{transform:translateY(-4px)}
.p11-ev .im{aspect-ratio:4/3;border-radius:9px;margin-bottom:14px}
.p11-ev h3{font:500 23px/1.1 var(--serif);padding:0 10px}
.p11-ev p{font-size:13.5px;opacity:.7;line-height:1.5;padding:6px 10px 12px}
.p11-ev .lnk{margin-left:10px;color:#1F7A5A}
@media(max-width:1000px){.p11-hero,.p11-sun{grid-template-columns:1fr}.p11-pic{min-height:56svh}.p11-ph{grid-template-columns:repeat(2,1fr)}.p11-ev{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.p11-ev{grid-template-columns:1fr}}
</style>

P.p1=()=>`${hdr('p1')}
<div class="p1-hero"><img class="kb" src="hero-sunset.webp" alt="El muelle de Boca Marina al atardecer">

<div class="p1-coord">18°27′ N · 69°36′ O · Boca Chica</div></div>
<div class="p1-lede" data-r><p>Cruzas el restaurante, el piso se vuelve madera y abajo está el mar. Aquí se come <em>con los pies sobre el agua</em> de Boca Chica.</p></div>

P.p4=()=>`${hdr('p4')}
<div class="p4-mast"><span>Edición Boca Chica</span><div class="lg">Boca <i>Marina</i></div><span>Sobre el mar · 2026</span></div>
<div class="p4-cover"><figure data-r>${im('hero-sunset.webp','El muelle al atardecer','im zoom')}<figcaption>En portada: el muelle de Boca Marina, cuando el sol toca el agua.</figcaption></figure>
<div class="p4-cl" data-r><h2>Sobre el mar, <i>en Boca Chica</i></h2><p class="p4-dek">A 20 minutos de Santo Domingo hay un muelle de madera donde se come langosta mirando el agua. Esta es su historia, en cuatro partes.</p>
<ol class="p4-toc"><li><b>04</b>Dónde sentarse: cinco lugares sobre el agua</li><li><b>12</b>La carta en cinco platos, uno de ellos premiado</li><li><b>20</b>El atardecer, minuto a minuto</li><li><b>26</b>Bodas, pedidas y otras celebraciones</li></ol>
<a class="btn b-deep" href="${MAIN}">${IC}Reserva por WhatsApp</a><p class="p4-small">${SIMPLE} Teléfono: 809-688-6810.</p></div></div>
<article class="p4-feat"><h3>Crónica · Boca Chica</h3><div class="p4-cols" data-r><p>Boca Chica se conoce por su playa de aguas tranquilas, protegida por el arrecife. Al final de la Prolongación Duarte, el restaurante se adelanta sobre el mar con un muelle de madera, y ahí empieza otra cosa.</p><p>Al mediodía el agua es turquesa y la gente se baña al lado de las mesas. Por la tarde llegan los cócteles y las camas balinesas se llenan. Cuando cae el sol, el muelle se pone dorado y nadie mira el teléfono.</p><p>Reservar es fácil a propósito: no hay formularios ni cuentas que crear. Escribes por WhatsApp, dices cuántos son y qué día, y te guardan la mesa.</p></div>
<blockquote class="p4-pq" data-r>“Aquí se come con los pies sobre el agua.”<small>Boca Marina, Boca Chica</small></blockquote></article>
${rec()}
<section class="p4-sec" id="p4-zonas"><div class="p4-sh" data-r><span>04</span><h2>Dónde sentarse</h2><p>Cada lugar, su propio plan</p></div>
<div class="p4-zg">${Z.map((z,i)=>`<article class="p4-z" data-r>${im(z.img,z.n,'im zoom')}<span class="k">Lugar ${n2(i)}</span><h3>${z.n}</h3><p>${z.d}</p><a class="lnk" href="${w(z.m)}">Reservar por WhatsApp</a></article>`).join('')}</div></section>
<section class="p4-sec" id="p4-menu"><div class="p4-sh" data-r><span>12</span><h2>La carta en cinco platos</h2><p>Sin precios: la carta completa, en el restaurante</p></div>
<div class="p4-dg">${D.slice(0,4).map((d,i)=>`<article class="p4-d" data-r>${im(d.img,d.n,'im zoom')}<b>${n2(i)}</b><h3>${d.n}</h3><p>${d.d}</p></article>`).join('')}
<aside class="p4-box" data-r><span class="eb">Premiado</span><h3>Portobello con camarones</h3><p>El plato que ganó el Festival Gastronómico de Santo Domingo en 2005.</p><hr><ul><li>Travellers' Choice 2024, TripAdvisor</li><li>Festival Gastronómico de Santo Domingo, 2005</li></ul></aside></div></section>
<section class="p4-sec"><div class="p4-sh" data-r><span>20</span><h2>El atardecer, minuto a minuto</h2><p>Hora aproximada, según la época del año</p></div>
<div class="p4-sun"><figure data-r>${im('coctel-sunset.webp','Cóctel frente al atardecer','im')}<figcaption>Un cóctel de la casa, justo antes de que el sol toque el agua.</figcaption></figure>
<div data-r><ol class="p4-tl"><li><b>17:30</b>Llegas, te sientas sobre el muelle y pides algo fresco.</li><li><b>18:00</b>La luz se vuelve naranja y el agua se pone de cobre.</li><li><b>18:20</b>El sol toca el horizonte. Todo el muelle mira hacia el mismo lado.</li><li><b>18:40</b>Se encienden las lámparas y empieza la cena.</li></ol><p style="margin-top:28px"><a class="btn b-deep" href="${SUN}">${IC}Reserva para el atardecer</a></p></div></div></section>
<section class="p4-sec" id="p4-eventos"><div class="p4-sh" data-r><span>26</span><h2>Agenda de celebraciones</h2><p>Cotiza tu fecha por WhatsApp</p></div>
<div class="p4-eg">${E.map(e=>`<article data-r>${im(e.img,e.n,'im zoom')}<h3>${e.n}</h3><p>${e.d}</p>${cot(e)}</article>`).join('')}</div></section>

${ftr('Te esperamos en Boca Chica. '+SIMPLE,'b-coral')}${fab()}`;

const CH=(k,a)=>`<div class="chips" data-k="${k}">${a.map((v,i)=>`<button data-v="${i}"${i?'':' class="on"'}>${v}</button>`).join('')}</div>`;
const NS=['2','4','6','8 o más'],DS=['hoy','mañana','este fin de semana','otra fecha'];
P.p11=()=>`${hdr('p11')}
<div class="p11-hero" id="p11-zonas"><div class="p11-pic"><img class="kb" src="hero-sunset.webp" alt="El muelle de Boca Marina al atardecer"><div data-r><span class="eb" style="color:var(--sea)">Boca Chica · a 20 minutos de Santo Domingo</span><h1>Sobre el mar,<br>en Boca Chica</h1><p>${SIMPLE}</p></div></div>
<div class="p11-chat"><div class="p11-top"><img src="${LOGO}" alt=""><div><b>Boca Marina</b><small>Reservas por WhatsApp · 809-688-6810</small></div></div>
<div class="bub">Hola, bienvenido a Boca Marina. ¿Dónde te gustaría sentarte?</div>${CH('z',Z.map(z=>z.n))}
<div class="bub">¿Cuántos van a ser?</div>${CH('n',NS)}
<div class="bub">¿Qué día?</div>${CH('d',DS.map(d=>d[0].toUpperCase()+d.slice(1)))}
<div class="bub out"><small>Tu mensaje</small><span id="p11-msg"></span></div>
<div class="p11-send"><a class="btn" id="p11-go" href="${MAIN}">${IC}Enviar por WhatsApp</a><span>No es un formulario: abrimos WhatsApp con este mensaje escrito y tú decides si lo envías.</span></div></div></div>
${rec()}
<section class="p11-sec" id="p11-menu"><span class="eb">Lo que más se pide</span><h2>Te mandaríamos estas fotos</h2>
<div class="p11-ph">${D.map(d=>`<figure data-r>${d.img?im(d.img,d.n,'im zoom'):`<div class="aw"><b>2005</b><span>Premio Festival<br>Gastronómico</span></div>`}<figcaption><b>${d.n}</b>${d.img?d.d:'Premio del Festival Gastronómico de Santo Domingo 2005.'}</figcaption></figure>`).join('')}</div></section>
<section class="p11-sec p11-sun">${im('coctel-sunset.webp','Cóctel al atardecer','im')}<div data-r><span class="eb">La hora dorada</span><h2>¿Vienes por el atardecer?</h2><p>Dínoslo en el mensaje y te sentamos de frente al sol. El muelle se pone dorado poco después de las seis.</p><a class="btn b-sand" href="${SUN}">${IC}Reserva para el atardecer</a></div></section>
<section class="p11-sec" id="p11-eventos"><span class="eb">Celebraciones</span><h2>Cotiza en un mensaje</h2>
<div class="p11-ev">${E.map(e=>`<a href="${w(e.m)}" data-r>${im(e.img,e.n,'im')}<h3>${e.n}</h3><p>${e.d}</p><span class="lnk">Cotizar por WhatsApp</span></a>`).join('')}</div></section>
${ftr(SIMPLE,'b-sand')}${fab()}`;

const META=[
 ['p1','Cine','Editorial cinematográfico','La portada es una toma de cine: el muelle al atardecer a pantalla completa con un acercamiento lento, el título encima y casi nada más. El resto se lee por capítulos.','Mirazur (Menton), Eleven Madison Park, portadas de estudios de cine.','Vende la emoción del lugar en los primeros tres segundos. Las zonas son una tira de fotogramas que se desliza y el plato premiado tiene su propia escena.'],
 ['p2','Tu lugar','Elige tu lugar primero','La decisión principal sube al primer pantallazo: eliges dónde sentarte y el botón ya lleva ese lugar en el mensaje de WhatsApp. Debajo, un mapa aéreo del muelle con un punto por zona.','Scorpios (Mykonos), Nikki Beach, Soho House.','La más pensada para convertir: la reserva está a dos toques y el mapa explica el lugar mejor que cualquier texto.'],
 ['p3','Tipográfico','Minimal tipográfico','Letra grande, mucho aire y listas numeradas. Casi sin fotos: aparecen solo al pasar el cursor sobre cada lugar o celebración.','Central (Lima), Noma, estudios de diseño suizos.','La más sobria y rápida de cargar. Transmite alta cocina y deja que los nombres de los platos hagan el trabajo.'],
 ['p4','Revista','Revista de viaje','La portada es una revista: cabecera, titulares de portada, índice, crónica con letra capitular, cita destacada y fotos con pie.','Condé Nast Traveler, Kinfolk, Cereal.','Cuenta historias (el atardecer minuto a minuto, dónde sentarse) y deja material listo para redes y prensa.'],
 ['p5','Nocturno','Nocturno lujoso','Fondo casi negro, líneas finas en coral dorado y un encabezado donde el atardecer se funde lentamente con la noche.','Zuma, Nobu Malibu, Gekko.','Posiciona a Boca Marina como lounge de noche y destino para celebrar. La más exclusiva de todas.'],
 ['p6','Mediterráneo','Mediterráneo luminoso','Blanco, arena y azul mar, con las fotos enmarcadas en arcos como una casa de las islas griegas y una tipografía alta y fina.','Nammos (Mykonos), Cap Juluca, Belmond.','La más luminosa y de día: ideal para vender almuerzos largos y bodas.'],
 ['p7','Carta','Carta de la casa','La página es una carta escrita por la casa: en primera persona, con recomendaciones como las daría un amigo, fotos pegadas en el margen y firma al final.','Noma, Chez Panisse, cartas de bienvenida de hoteles boutique.','La más cálida y humana. Los lugares son enlaces dentro del texto, cada uno con su mensaje de WhatsApp.'],
 ['p8','Un día','Un día en Boca Marina','Un recorrido de mediodía a noche: el fondo y el reloj lateral cambian de color con el scroll, y cada hora propone sus lugares y sus platos.','Páginas de producto de Apple, Amangiri, Six Senses.','Demuestra que Boca Marina sirve todo el día, no solo para cenar, y ordena las zonas por momento.'],
 ['p9','Dividido','Pantalla dividida','La foto queda fija a la izquierda y cambia según lo que lees a la derecha; al pasar sobre cada lugar se ve su foto.','Aesop, Le Sirenuse (Positano), Hotel Esencia.','Navegación muy clara, se siente como una galería. En el celular se vuelve una columna con una foto por bloque.'],
 ['p10','Postal','Postal caribeña refinada','Tarjetas con borde blanco, sellos perforados, matasellos y un mapa dibujado de Santo Domingo a Boca Chica.','Il Pellicano, Rosewood Little Dix Bay, la estética de Wes Anderson.','Tiene personalidad propia y se recuerda. El mapa resuelve el "a 20 minutos" de un vistazo.'],
 ['p11','Conversación','Reserva conversacional (extra)','La portada es un chat: tocas lugar, personas y día, y el mensaje de WhatsApp se arma solo. El resto de la página sigue el tono de una conversación.','Interfaces de mensajería, conserjes de hotel por chat, Resy.','La más directa al objetivo. No es un formulario: la web no envía nada, solo deja el mensaje escrito en WhatsApp.']];

document.getElementById('tabs').innerHTML=META.map(m=>`<a href="#i-${m[0]}" data-t="${m[0]}"><i>${m[0].toUpperCase()}</i>${m[1]}</a>`).join('');
document.getElementById('root').innerHTML=META.map(m=>`<div class="intro" id="i-${m[0]}"><div class="intro-n">${m[0].toUpperCase()}</div><div><h2>${m[2]}</h2><dl><dt>Concepto</dt><dd>${m[3]}</dd><dt>Referencias</dt><dd>${m[4]}</dd><dt>Lo distinto</dt><dd>${m[5]}</dd></dl></div></div><section class="mock ${m[0]}" id="${m[0]}">${P[m[0]]()}</section>`).join('');

const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px'});
document.querySelectorAll('[data-r]').forEach(el=>rm?el.classList.add('in'):io.observe(el));
const mid=(els,fn)=>{const o=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&fn(e.target)),{rootMargin:'-45% 0px -50% 0px'});els.forEach(el=>o.observe(el))};
const tabs=[...document.querySelectorAll('#tabs a')];
mid(document.querySelectorAll('.mock,.intro'),el=>{const id=el.id.replace('i-','');tabs.forEach(t=>{const on=t.dataset.t===id;t.classList.toggle('on',on);if(on)t.scrollIntoView({block:'nearest',inline:'nearest'})})});

const p2=i=>{const z=Z[i];document.querySelectorAll('.p2 [data-p2]').forEach(b=>b.classList.toggle('on',+b.dataset.p2===i));const img=document.getElementById('p2-img');img.src=z.img;img.alt=z.n;document.getElementById('p2-d').textContent=z.d;document.getElementById('p2-go').href=w(z.m);document.getElementById('p2-gl').textContent='Reservar '+z.ph};
document.querySelectorAll('.p2 [data-p2]').forEach(b=>b.addEventListener('click',()=>p2(+b.dataset.p2)));

const day=document.getElementById('p8-day'),dots=[...day.querySelectorAll('.p8-clock li')],secs=[...day.querySelectorAll('.p8-c')];
mid(secs,s=>{day.className='p8-day '+s.dataset.c;document.getElementById('p8-h').textContent=s.dataset.h;document.getElementById('p8-l').textContent=s.dataset.l;dots.forEach((d,i)=>d.classList.toggle('on',secs[i]===s))});

const p9i=[...document.querySelectorAll('.p9-imgs img')],cap=document.getElementById('p9-cap'),idx=document.getElementById('p9-idx');
const p9show=img=>{p9i.forEach(x=>x.classList.toggle('on',x===img));cap.textContent=img.alt};
let p9k=0;
mid(document.querySelectorAll('.p9-pn'),pn=>{p9k=+pn.dataset.k;p9show(p9i[p9k]);idx.textContent=n2(p9k)+' / 06'});
document.querySelectorAll('.p9-zl a').forEach(a=>{a.addEventListener('mouseenter',()=>p9show(document.querySelector(`.p9-imgs img[data-z="${a.dataset.z}"]`)));a.addEventListener('mouseleave',()=>p9show(p9i[p9k]))});

const st={z:0,n:0,d:0};
const p11=()=>{const z=Z[st.z],d=DS[st.d],n=NS[st.n];const msg=`Hola, quiero reservar ${z.ph} para ${n} personas ${d==='otra fecha'?'el __':d}. ¿Tienen disponibilidad?`;document.getElementById('p11-msg').textContent=msg;document.getElementById('p11-go').href=w(msg)};
document.querySelectorAll('.p11 .chips').forEach(c=>c.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;c.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));st[c.dataset.k]=+b.dataset.v;p11()}));
p11();
</script>
</body>
</html>
